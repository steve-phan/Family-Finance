services:
  postgres:
    image: postgres:16-alpine
    container_name: family-finance-db
    environment:
      POSTGRES_DB: family_finance
      POSTGRES_USER: family
      POSTGRES_PASSWORD: family
    ports:
      - "5432:5432"
    volumes:
      - family_finance_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_finance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  family_finance_data:
